<app-playground-example-card [heading]="'otpInput.examples.default' | transloco">
  <div
    role="group"
    [attr.aria-label]="'otpInput.accessibility.default' | transloco"
    class="otp-input-default__content"
  >
    <kui-field [label]="'otpInput.fields.verificationCode' | transloco">
      <kui-otp-input [(value)]="code" />
    </kui-field>

    <app-otp-input-readout [value]="code()" />
  </div>
</app-playground-example-card>
