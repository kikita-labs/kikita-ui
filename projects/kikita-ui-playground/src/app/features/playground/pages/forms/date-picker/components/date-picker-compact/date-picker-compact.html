<section role="group" [attr.aria-label]="'datePicker.accessibility.compact' | transloco">
  <app-playground-example-card [heading]="'datePicker.examples.compact' | transloco">
    <kui-field size="sm" [label]="'datePicker.fields.compactDate' | transloco">
      <input kuiDatePicker [(value)]="selectedDate" [(viewDate)]="viewDate" />
      <kui-dropdown panelRole="dialog" panelWidth="auto" maxHeight="420px">
        <kui-calendar
          size="sm"
          flat
          showFooter
          [locale]="calendarLocale()"
          class="date-picker-calendar"
        />
      </kui-dropdown>
    </kui-field>
  </app-playground-example-card>
</section>
