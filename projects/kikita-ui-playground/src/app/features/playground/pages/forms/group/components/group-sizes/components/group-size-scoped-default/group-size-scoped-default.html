<div class="group-size-scoped-default">
  <p kuiText variant="body-sm">{{ 'group.labels.scopedDefault' | transloco }}</p>
  <div
    kuiGroup
    collapsed
    role="group"
    [attr.aria-label]="'group.accessibility.scopedDefault' | transloco"
  >
    <input kuiInput type="search" [attr.aria-label]="'group.fields.search' | transloco" />
    <button
      kuiIconButton
      icon="search"
      shape="outline"
      type="button"
      [attr.aria-label]="'group.actions.search' | transloco"
    ></button>
  </div>
</div>
