<app-playground-example-card [heading]="'splitter.examples.default' | transloco">
  <div
    class="splitter-default__content"
    role="group"
    [attr.aria-label]="'splitter.accessibility.default' | transloco"
  >
    <app-splitter-example [heading]="'splitter.variants.twoPanes' | transloco">
      <kui-splitter>
        <kui-splitter-pane>
          <app-splitter-pane-label>{{ 'splitter.panes.left' | transloco }}</app-splitter-pane-label>
        </kui-splitter-pane>
        <kui-splitter-pane>
          <app-splitter-pane-label>
            {{ 'splitter.panes.right' | transloco }}
          </app-splitter-pane-label>
        </kui-splitter-pane>
      </kui-splitter>
    </app-splitter-example>
  </div>
</app-playground-example-card>
