<app-playground-example-card [heading]="'icon.examples.sources' | transloco">
  <div class="icon-source-examples__grid">
    <div
      class="icon-source-examples__item"
      role="group"
      [attr.aria-label]="'icon.accessibility.registeredName' | transloco"
    >
      <kui-icon name="kikita-brand" size="xl" [label]="'icon.labels.registeredBrand' | transloco" />
      <span kuiText variant="caption">{{ 'icon.labels.registeredName' | transloco }}</span>
    </div>

    <div
      class="icon-source-examples__item"
      role="group"
      [attr.aria-label]="'icon.accessibility.directSource' | transloco"
    >
      <kui-icon
        [source]="directSource"
        size="xl"
        [label]="'icon.labels.staticSource' | transloco"
      />
      <span kuiText variant="caption">{{ 'icon.labels.directSource' | transloco }}</span>
    </div>

    <div
      class="icon-source-examples__item"
      role="group"
      [attr.aria-label]="'icon.accessibility.imageSource' | transloco"
    >
      <kui-icon src="/favicon.ico" size="xl" [label]="'icon.labels.imageSource' | transloco" />
      <span kuiText variant="caption">{{ 'icon.labels.imageUrl' | transloco }}</span>
    </div>

    <div
      class="icon-source-examples__item"
      role="group"
      [attr.aria-label]="'icon.accessibility.projectedSource' | transloco"
    >
      <kui-icon size="xl" [label]="'icon.labels.projectedSource' | transloco">
        <svg viewBox="0 0 24 24" fill="none" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <g stroke="currentColor" fill="none" stroke-linecap="round">
            <rect x="2" y="2" width="7.2727" height="7.2727" rx="1.1818" stroke-width="1.1818" />
            <rect
              x="14.7273"
              y="2"
              width="7.2727"
              height="7.2727"
              rx="1.1818"
              stroke-width="1.1818"
            />
            <rect
              x="2"
              y="14.7273"
              width="7.2727"
              height="7.2727"
              rx="1.1818"
              stroke-width="1.1818"
            />
            <rect
              x="14.7273"
              y="14.7273"
              width="7.2727"
              height="7.2727"
              rx="1.1818"
              stroke-width="1.1818"
            />
          </g>
          <g stroke="currentColor" opacity="0.35" stroke-width="1.1818">
            <line x1="9.2727" y1="5.6364" x2="14.7273" y2="5.6364" />
            <line x1="18.3636" y1="9.2727" x2="18.3636" y2="14.7273" />
            <line x1="9.2727" y1="18.3636" x2="14.7273" y2="18.3636" />
          </g>
          <path
            d="M11.4374,12.5909 A0.7675,0.7675 0 0,1 11.98,12.8157 L14.3095,15.1451 L15.1451,14.3095 L13.0287,12.193 A0.273,0.273 0 0,1 13.0287,11.807 L15.1451,9.6905 L14.3095,8.8549 L11.98,11.1843 A0.7675,0.7675 0 0,1 11.4374,11.4091 L6.5452,11.4091 A0.3179,0.3179 0 0,1 6.2273,11.0912 L6.2273,9.2727 L5.0455,9.2727 L5.0455,14.7273 L6.2273,14.7273 L6.2273,12.9088 A0.3179,0.3179 0 0,1 6.5452,12.5909 Z"
            fill="currentColor"
          />
        </svg>
      </kui-icon>
      <span kuiText variant="caption">{{ 'icon.labels.projectedSvg' | transloco }}</span>
    </div>
  </div>
</app-playground-example-card>
