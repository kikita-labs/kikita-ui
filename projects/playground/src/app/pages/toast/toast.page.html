<div class="page">
  <!-- p.01 Appearances -->
  <app-panel num="01" title="Appearances">
    <div class="toast-btn-row">
      <button kuiButton (click)="openSuccess()">Success</button>
      <button kuiButton appearance="danger" (click)="openDanger()">Danger (persistent)</button>
      <button kuiButton shape="outline" (click)="openWarning()">Warning (persistent)</button>
      <button kuiButton shape="ghost" (click)="openInfo()">Info</button>
      <button kuiButton shape="soft" (click)="openNeutral()">Neutral + Action</button>
    </div>
  </app-panel>

  <!-- p.02 Variants -->
  <app-panel num="02" title="Structure variants">
    <div class="toast-btn-row">
      <button kuiButton shape="outline" (click)="openTitleOnly()">Title only</button>
      <button kuiButton shape="outline" (click)="openWithProgress()">Progress bar</button>
    </div>
  </app-panel>

  <!-- p.03 Position -->
  <app-panel num="03" title="Position">
    <div class="toast-position-row">
      <span class="toast-position-label">Region position:</span>
      @for (p of positions; track p) {
        <button kuiButton [shape]="position() === p ? 'solid' : 'outline'" (click)="setPosition(p)">
          {{ p }}
        </button>
      }
    </div>
    <p class="toast-note">
      Default is <code>bottom-center</code>. Switching updates the existing region. Buttons above
      show toasts in the current position.
    </p>
  </app-panel>

  <!-- p.04 Lifecycle -->
  <app-panel num="04" title="Lifecycle controls">
    <div class="toast-btn-row">
      <button kuiButton (click)="openPersistent()">Open reactive persistent</button>
      <button kuiButton shape="outline" (click)="releasePersistent()">Start auto-dismiss</button>
      <button kuiButton shape="outline" (click)="updatePersistent()">Update to success</button>
      <button kuiButton shape="ghost" (click)="dismissAll()">Dismiss all</button>
    </div>
    <p class="toast-note">
      <code>persistent</code> accepts a signal. <code>ref.update()</code> can switch a tracked toast
      from a persistent loading state to a timed success state.
    </p>
  </app-panel>
</div>
