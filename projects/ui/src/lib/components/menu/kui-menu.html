<ng-template #menuTpl>
  <div [style.transform]="alignTransform()">
    <div
      [id]="panelId"
      class="kui-menu"
      [class.kui-menu--closing]="isClosing()"
      role="menu"
      [attr.aria-label]="ariaLabel() ?? messages().label"
      (click)="onPanelClick($event)"
      (keydown)="onPanelKeydown($event)"
      (animationend)="onAnimationEnd($event)"
    >
      <ng-content />
    </div>
  </div>
</ng-template>
