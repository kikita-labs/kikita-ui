@for (node of nodes(); track $index) {
  @switch (node.tag) {
    @case ('path') {
      <svg:path
        [attr.d]="node.attrs['d']"
        [attr.fill-rule]="node.attrs['fill-rule']"
        [attr.clip-rule]="node.attrs['clip-rule']"
        [attr.fill]="node.attrs['fill']"
        [attr.fill-opacity]="node.attrs['fill-opacity']"
        [attr.stroke]="node.attrs['stroke']"
        [attr.stroke-opacity]="node.attrs['stroke-opacity']"
        [attr.stroke-linecap]="node.attrs['stroke-linecap']"
        [attr.stroke-linejoin]="node.attrs['stroke-linejoin']"
        [attr.stroke-miterlimit]="node.attrs['stroke-miterlimit']"
        [attr.stroke-dasharray]="node.attrs['stroke-dasharray']"
        [attr.stroke-dashoffset]="node.attrs['stroke-dashoffset']"
        [attr.opacity]="node.attrs['opacity']"
        [attr.transform]="node.attrs['transform']"
      />
    }
    @case ('line') {
      <svg:line
        [attr.x1]="node.attrs['x1']"
        [attr.y1]="node.attrs['y1']"
        [attr.x2]="node.attrs['x2']"
        [attr.y2]="node.attrs['y2']"
        [attr.fill]="node.attrs['fill']"
        [attr.fill-opacity]="node.attrs['fill-opacity']"
        [attr.stroke]="node.attrs['stroke']"
        [attr.stroke-opacity]="node.attrs['stroke-opacity']"
        [attr.stroke-linecap]="node.attrs['stroke-linecap']"
        [attr.stroke-linejoin]="node.attrs['stroke-linejoin']"
        [attr.stroke-miterlimit]="node.attrs['stroke-miterlimit']"
        [attr.stroke-dasharray]="node.attrs['stroke-dasharray']"
        [attr.stroke-dashoffset]="node.attrs['stroke-dashoffset']"
        [attr.opacity]="node.attrs['opacity']"
        [attr.transform]="node.attrs['transform']"
      />
    }
    @case ('polyline') {
      <svg:polyline
        [attr.points]="node.attrs['points']"
        [attr.fill]="node.attrs['fill']"
        [attr.fill-opacity]="node.attrs['fill-opacity']"
        [attr.stroke]="node.attrs['stroke']"
        [attr.stroke-opacity]="node.attrs['stroke-opacity']"
        [attr.stroke-linecap]="node.attrs['stroke-linecap']"
        [attr.stroke-linejoin]="node.attrs['stroke-linejoin']"
        [attr.stroke-miterlimit]="node.attrs['stroke-miterlimit']"
        [attr.stroke-dasharray]="node.attrs['stroke-dasharray']"
        [attr.stroke-dashoffset]="node.attrs['stroke-dashoffset']"
        [attr.opacity]="node.attrs['opacity']"
        [attr.transform]="node.attrs['transform']"
      />
    }
    @case ('polygon') {
      <svg:polygon
        [attr.points]="node.attrs['points']"
        [attr.fill-rule]="node.attrs['fill-rule']"
        [attr.clip-rule]="node.attrs['clip-rule']"
        [attr.fill]="node.attrs['fill']"
        [attr.fill-opacity]="node.attrs['fill-opacity']"
        [attr.stroke]="node.attrs['stroke']"
        [attr.stroke-opacity]="node.attrs['stroke-opacity']"
        [attr.stroke-linecap]="node.attrs['stroke-linecap']"
        [attr.stroke-linejoin]="node.attrs['stroke-linejoin']"
        [attr.stroke-miterlimit]="node.attrs['stroke-miterlimit']"
        [attr.stroke-dasharray]="node.attrs['stroke-dasharray']"
        [attr.stroke-dashoffset]="node.attrs['stroke-dashoffset']"
        [attr.opacity]="node.attrs['opacity']"
        [attr.transform]="node.attrs['transform']"
      />
    }
    @case ('circle') {
      <svg:circle
        [attr.cx]="node.attrs['cx']"
        [attr.cy]="node.attrs['cy']"
        [attr.r]="node.attrs['r']"
        [attr.fill]="node.attrs['fill']"
        [attr.fill-opacity]="node.attrs['fill-opacity']"
        [attr.stroke]="node.attrs['stroke']"
        [attr.stroke-opacity]="node.attrs['stroke-opacity']"
        [attr.stroke-linecap]="node.attrs['stroke-linecap']"
        [attr.stroke-linejoin]="node.attrs['stroke-linejoin']"
        [attr.stroke-miterlimit]="node.attrs['stroke-miterlimit']"
        [attr.stroke-dasharray]="node.attrs['stroke-dasharray']"
        [attr.stroke-dashoffset]="node.attrs['stroke-dashoffset']"
        [attr.opacity]="node.attrs['opacity']"
        [attr.transform]="node.attrs['transform']"
      />
    }
    @case ('ellipse') {
      <svg:ellipse
        [attr.cx]="node.attrs['cx']"
        [attr.cy]="node.attrs['cy']"
        [attr.rx]="node.attrs['rx']"
        [attr.ry]="node.attrs['ry']"
        [attr.fill]="node.attrs['fill']"
        [attr.fill-opacity]="node.attrs['fill-opacity']"
        [attr.stroke]="node.attrs['stroke']"
        [attr.stroke-opacity]="node.attrs['stroke-opacity']"
        [attr.stroke-linecap]="node.attrs['stroke-linecap']"
        [attr.stroke-linejoin]="node.attrs['stroke-linejoin']"
        [attr.stroke-miterlimit]="node.attrs['stroke-miterlimit']"
        [attr.stroke-dasharray]="node.attrs['stroke-dasharray']"
        [attr.stroke-dashoffset]="node.attrs['stroke-dashoffset']"
        [attr.opacity]="node.attrs['opacity']"
        [attr.transform]="node.attrs['transform']"
      />
    }
    @case ('rect') {
      <svg:rect
        [attr.x]="node.attrs['x']"
        [attr.y]="node.attrs['y']"
        [attr.width]="node.attrs['width']"
        [attr.height]="node.attrs['height']"
        [attr.rx]="node.attrs['rx']"
        [attr.ry]="node.attrs['ry']"
        [attr.fill]="node.attrs['fill']"
        [attr.fill-opacity]="node.attrs['fill-opacity']"
        [attr.stroke]="node.attrs['stroke']"
        [attr.stroke-opacity]="node.attrs['stroke-opacity']"
        [attr.stroke-linecap]="node.attrs['stroke-linecap']"
        [attr.stroke-linejoin]="node.attrs['stroke-linejoin']"
        [attr.stroke-miterlimit]="node.attrs['stroke-miterlimit']"
        [attr.stroke-dasharray]="node.attrs['stroke-dasharray']"
        [attr.stroke-dashoffset]="node.attrs['stroke-dashoffset']"
        [attr.opacity]="node.attrs['opacity']"
        [attr.transform]="node.attrs['transform']"
      />
    }
  }
}
