name: CI

# Linux verification for pull requests and release-line pushes. Screenshot
# (visual) suites are intentionally not run here yet: they need Linux baselines.
on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  verify:
    name: Static checks, unit tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm audit:static
      - run: pnpm skills:check
      - run: pnpm test:scripts
      - run: pnpm test
      - run: pnpm test:kikita-ui-playground
      - run: pnpm build
      - run: pnpm build:playground
      - run: pnpm build:kikita-ui-playground

  browser:
    name: Playground SSR and browser behavior (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - run: pnpm exec playwright install --with-deps chromium

      # Builds the playground, then runs the SSR hydration suite.
      - run: pnpm test:ssr

      # Behavior project only: the visual project needs Linux baselines.
      - run: pnpm build:kikita-ui-playground
      - run: pnpm exec playwright test --config=playwright.kikita-ui-playground.config.ts --project=behavior

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
