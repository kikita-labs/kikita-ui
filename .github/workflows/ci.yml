name: CI

# Linux verification for pull requests and release-line pushes. Screenshot suites run in the
# pinned Playwright Docker image so they match the committed *-linux.png baselines.
on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  verify:
    name: Static checks, unit tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm audit:static
      - run: pnpm skills:check
      - run: pnpm test:scripts
      - run: pnpm test
      - run: pnpm test:kikita-ui-playground
      - run: pnpm build
      - run: pnpm build:playground
      - run: pnpm build:kikita-ui-playground

  browser:
    name: Browser behavior (Chromium, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs in the Playwright image: browsers and system libraries are preinstalled, so the job never
    # depends on apt mirrors. Keep the tag equal to the installed @playwright/test version;
    # scripts/visual-docker.spec.mjs fails when they drift.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Behavior project only: the visual project runs in the `visual` job.
      - run: pnpm build:kikita-ui-playground
      - run: pnpm exec playwright test --config=playwright.kikita-ui-playground.config.ts --project=behavior --shard=${{ matrix.shard }}/3 --fully-parallel

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  ssr:
    name: Library SSR hydration (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs in the Playwright image: browsers and system libraries are preinstalled, so the job never
    # depends on apt mirrors. Keep the tag equal to the installed @playwright/test version;
    # scripts/visual-docker.spec.mjs fails when they drift.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds the playground, then runs the SSR hydration suite.
      - run: pnpm test:ssr

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ssr-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual:
    name: Visual baselines (Playwright Docker image, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # The committed baselines are *-linux.png captured in this exact image. Keep the tag equal to the
    # installed @playwright/test version; scripts/visual-docker.spec.mjs fails when they drift.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:kikita-ui-playground
      - run: pnpm exec playwright test --config=playwright.kikita-ui-playground.config.ts --project=visual --shard=${{ matrix.shard }}/4 --fully-parallel

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual-library:
    name: Visual baselines, library (Playwright Docker image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same pinned image as the `visual` job.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:playground
      - run: pnpm exec playwright test --project=visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-library-diffs
          path: |
            playwright-report/
            test-results/
          retention-days: 7
